<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183f35"><title>Fitville LifeRPG</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5ed;color:#203c33;font:16px system-ui,sans-serif}header{background:#183f35;color:white;padding:24px 20px}header>div,main{max-width:720px;margin:auto}h1{margin:0;font-size:30px}p{line-height:1.5}.muted{color:#597067;font-size:14px}header .muted{color:#bdd5c8}main{padding:18px 16px 100px}button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:#28684f;color:white;cursor:pointer;min-height:44px}button:disabled{opacity:.5;cursor:default}.card{background:white;border:1px solid #d9e3d5;border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 4px 16px #203c3307}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}h2{font-size:21px;margin:0 0 12px}h3{margin:0;font-size:18px}.scores{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:16px}.scores button{padding:10px 0;background:#edf1e8;color:#203c33}.scores button[aria-pressed=true]{background:#28684f;color:white;outline:2px solid #d5a850}progress{width:100%;height:14px;accent-color:#d5a850;margin:12px 0 4px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d9e3d5;display:flex;justify-content:center;padding:10px 8px calc(10px + env(safe-area-inset-bottom));gap:10px}nav button{background:#edf1e8;color:#203c33}nav button[aria-selected=true]{background:#183f35;color:white}#notice{position:fixed;top:14px;left:16px;right:16px;max-width:680px;margin:auto;background:#183f35;color:white;padding:16px;border-radius:14px;z-index:3}#notice:empty{display:none}.wide{width:100%}.stats{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}.stats span{background:#ffffff15;padding:8px 12px;border-radius:10px}.building{font-size:36px}.pill{font-size:12px;background:#edf1e8;padding:5px 9px;border-radius:20px}.tools{margin-top:24px}a{color:#28684f}

body{background:radial-gradient(ellipse at top,#e4efe3,transparent 70%),#faf7ee}header{background:linear-gradient(130deg,#173f36,#326b53);border-radius:0 0 32px 32px;padding-top:30px;box-shadow:0 10px 30px #183f3515}h1{font-size:34px;letter-spacing:-1.2px}header p{margin:8px 0}main{max-width:720px}.card{background:#fffdf8;border-color:#e7e7d8;box-shadow:0 5px 0 #e7e7d866,0 10px 26px #203c3308}button{transition:transform .15s,background .2s;box-shadow:0 3px 0 #183f3520}button:active{transform:translateY(2px)}button:focus-visible{outline:3px solid #bf871d;outline-offset:4px}.skill-card{border-left:5px solid var(--skill)}.skill-card h3{color:var(--skill)}.skill-card .scores button[aria-pressed=true]{background:var(--skill);outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--skill) 20%,transparent)}.skill-card progress{accent-color:var(--skill)}.level-badge{background:var(--skill);color:#fff;border-radius:13px;padding:9px 12px;white-space:nowrap;font-size:14px}.building{background:#f0f3e9;border-radius:17px;width:64px;height:64px;display:grid;place-items:center;flex-shrink:0}.pill{background:#e7f1e0;color:#355c36}.town-map{position:relative;overflow:hidden;border-radius:24px;background:#acd193;margin-bottom:18px;border:5px solid #fffdf8;box-shadow:0 8px 25px #203c3310;aspect-ratio:1.1}.town-map>svg{width:100%;height:100%;position:absolute;inset:0}.map-building{position:absolute;width:30%;padding:0;background:transparent;color:#203c33;box-shadow:none;min-height:0;filter:drop-shadow(0 4px 2px #36563725)}.map-building svg{display:block;width:100%;height:auto}.map-building .map-label{display:inline-block;background:#fffdf5ef;border:1px solid #e3dec5;border-radius:9px;padding:4px 6px;font-size:clamp(10px,2.6vw,13px);font-weight:650;box-shadow:0 3px 0 #7d9a6720}.map-building:hover{transform:translateY(-3px)}.map-building:nth-of-type(1){left:9%;top:5%}.map-building:nth-of-type(2){right:9%;top:5%}.map-building:nth-of-type(3){left:2%;top:44%}.map-building:nth-of-type(4){right:2%;top:44%}.map-building:nth-of-type(5){left:35%;top:65%}.town-heading{margin:5px 4px 14px}.town-heading p{margin:0}.collect-card{background:linear-gradient(120deg,#fffae7,#fffdf8)}#collect{background:#b77b20;color:white;font-weight:650;width:100%}nav{background:#fffdf5f5;backdrop-filter:blur(12px);gap:6px}nav button{flex:1;max-width:170px;background:transparent;box-shadow:none;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:3px}nav button span{font-size:21px}nav button[aria-selected=true]{background:#e4eee1;color:#183f35}#notice{box-shadow:0 8px 30px #203c3325;border:1px solid #eac67a;animation:toast .25s ease-out}.reward{position:fixed;z-index:5;left:50%;top:40%;pointer-events:none;color:#865411;font-size:28px;font-weight:800;text-shadow:0 2px #fff;background:#fff5d7;border-radius:20px;padding:15px 22px;animation:reward 1.8s ease-out forwards}.celebrate{animation:glow 1s ease-out}.upgrade-flash{animation:glow 1s ease-out}.map-caption{text-align:center;font-size:12px;color:#4b6555;margin:-6px 0 20px}@keyframes reward{0%{opacity:0;transform:translate(-50%,20px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90px)}}@keyframes toast{from{transform:translateY(-15px);opacity:0}to{transform:translateY(0);opacity:1}}@keyframes glow{0%,100%{box-shadow:0 5px 0 #e7e7d866}45%{box-shadow:0 0 25px 8px #e4be5b80}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.reward{opacity:1}}

</style></head><body>
<header><div><div class="muted">YOUR EVERYDAY ADVENTURE</div><h1>Fitville LifeRPG</h1><p class="muted">Small habits. A growing town.</p><div class="stats"><span id="wallet"></span><span id="total"></span></div></div></header>
<main id="view"></main><div id="notice" role="status"></div>
<nav aria-label="Main navigation"><button data-tab="town"><span aria-hidden="true">⌂</span>Town</button><button data-tab="check"><span aria-hidden="true">✓</span>Check-In</button><button data-tab="skills"><span aria-hidden="true">✦</span>Skills</button></nav>
<script>
const SKILLS=[
{name:'Sleep',building:'Rest Lodge',icon:'🌙',hint:'Your proposed 5/5 target: 7½–8½ hours of sleep.'},
{name:'Healthy Eating',building:'Fresh Market',icon:'🥗',hint:'Rate how well you followed your personal eating goals.'},
{name:'Stretching',building:'Wellness Studio',icon:'🧘',hint:'Rate completion of your planned mobility routine.'},
{name:'Cardio',building:'Walking Trail',icon:'🚶',hint:'Rate completion of your movement or cardio goal.'},
{name:'Strength',building:'Training Gym',icon:'🏋️',hint:'Rate following your workout plan; planned recovery counts.'}
];
const TIERS=['Starter','Basic','Improved','Advanced','Elite','Master'];
const RATES=[1,5,20,80,250,600], COSTS=[0,100,500,2000,8000,25000];
const KEY='fitville-v1', CAP=8*60*60*1000;
const XP=[0,0];let points=0;for(let l=1;l<99;l++){points+=Math.floor(l+300*Math.pow(2,l/7));XP[l+1]=Math.ceil(Math.floor(points/4)/100);}
function level(x){let l=1;while(l<99&&x>=XP[l+1])l++;return l;}
function fresh(){return{coins:0,skills:SKILLS.map(()=>({xp:0,tier:0})),days:{},last:Date.now(),bank:0};}
let state=fresh(),storageOK=true;
try{let raw=localStorage.getItem(KEY);if(raw){let s=JSON.parse(raw);if(!s||!Number.isFinite(s.coins)||s.coins<0||!Array.isArray(s.skills)||s.skills.length!==5||!s.skills.every(x=>Number.isFinite(x.xp)&&x.xp>=0&&Number.isInteger(x.tier)&&x.tier>=0&&x.tier<6)||!s.days||!Number.isFinite(s.last)||!Number.isFinite(s.bank))throw Error('Invalid save');state=s;}}catch(e){storageOK=false;}
let tab='town',draft=[],timer;
function day(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function income(){return 2+state.skills.reduce((n,s)=>n+s.tier*2,0);}
function accrue(){const now=Date.now();state.bank=Math.min(income()*8,state.bank+Math.min(CAP,Math.max(0,now-state.last))/3600000*income());state.last=now;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;notify('Saving is unavailable. Keep this page open or export a backup.');}}
function notify(t){document.getElementById('notice').textContent=t;clearTimeout(timer);timer=setTimeout(()=>document.getElementById('notice').textContent='',5000);}

const COLORS=['#7962a6','#4f7836','#267b7d','#ad5b28','#3b6daa'];
function house(i,t){
const c=COLORS[i], roofs=['#8871b4','#6e954d','#479a98','#d48550','#588ac2'];
return '<svg viewBox="0 0 140 110" aria-hidden="true"><ellipse cx="70" cy="98" rx="50" ry="9" fill="#628957" opacity=".25"/>'+
(t>1?'<rect x="14" y="55" width="25" height="38" rx="3" fill="#f1dfbc"/><path d="M10 55L26 40L42 55Z" fill="'+roofs[i]+'"/>':'')+
'<rect x="35" y="48" width="70" height="47" rx="4" fill="#fff0cf"/><path d="M25 50L70 19L115 50Z" fill="'+roofs[i]+'"/><path d="M25 50L70 19L115 50" fill="none" stroke="'+c+'" stroke-width="5" stroke-linejoin="round"/><rect x="61" y="66" width="19" height="29" rx="5" fill="#866947"/><rect x="43" y="60" width="12" height="15" rx="3" fill="#9fc6cb"/><rect x="86" y="60" width="12" height="15" rx="3" fill="#9fc6cb"/>'+
(t>0?'<rect x="92" y="20" width="9" height="22" rx="2" fill="#c79976"/>':'')+
(t>2?'<path d="M37 78H103V87H37Z" fill="'+roofs[i]+'"/><rect x="108" y="58" width="10" height="36" fill="#dcc79e"/>':'')+
(t>3?'<path d="M113 19V60" stroke="#795d42" stroke-width="3"/><path d="M114 20H135L124 28L135 35H114Z" fill="#e7bb53"/>':'')+
(t>4?'<path d="M59 16L63 7L70 13L77 7L81 16Z" fill="#ecc75a" stroke="#ad8026" stroke-width="2"/>':'')+
'<text x="70" y="52" text-anchor="middle" font-size="20">'+SKILLS[i].icon+'</text></svg>';
}
function village(){return '<div class="row town-heading"><div><h2>Your little Fitville</h2><p class="muted">Grow a town, one good day at a time.</p></div><span class="pill">5 neighbourhoods</span></div><div class="town-map" aria-label="Fitville village"><svg viewBox="0 0 600 550" preserveAspectRatio="none" aria-hidden="true"><rect width="600" height="550" fill="#b6d79d"/><path d="M0 270Q180 220 300 285T600 245M300 0V550" stroke="#e9dbb7" stroke-width="38" fill="none"/><path d="M300 150L125 155M300 150L475 155M300 370L115 370M300 370L485 370" stroke="#e9dbb7" stroke-width="24"/><ellipse cx="300" cy="280" rx="53" ry="42" fill="#ded8b8"/><ellipse cx="300" cy="274" rx="36" ry="26" fill="#79b7c0"/><ellipse cx="300" cy="270" rx="22" ry="13" fill="#a3d3d6"/><path d="M300 246V269" stroke="#f3f9e8" stroke-width="6" stroke-linecap="round"/>'+
[[30,40],[550,25],[45,195],[565,183],[25,490],[545,490],[200,460],[425,445]].map(([x,y])=>'<g transform="translate('+x+' '+y+')"><rect x="13" y="24" width="8" height="22" rx="3" fill="#93754c"/><circle cx="17" cy="14" r="23" fill="#6c9c5c"/><circle cx="10" cy="9" r="14" fill="#80ad66"/></g>').join('')+
'<g fill="#f9efc8"><circle cx="205" cy="220" r="4"/><circle cx="405" cy="208" r="4"/><circle cx="155" cy="470" r="4"/></g></svg>'+SKILLS.map((s,i)=>'<button class="map-building" data-building="'+i+'" aria-label="View '+s.building+' upgrades">'+house(i,state.skills[i].tier)+'<span class="map-label">'+s.building+'</span></button>').join('')+'</div><p class="map-caption">Tap a building to visit its training shop</p>';}
function reward(text){let el=document.createElement('div');el.className='reward';el.textContent=text;document.body.append(el);setTimeout(()=>el.remove(),1900);}

function render(){accrue();document.getElementById('wallet').textContent='🪙 '+Math.floor(state.coins).toLocaleString()+' coins';document.getElementById('total').textContent='Total level '+state.skills.reduce((n,s)=>n+level(s.xp),0)+' / 495';
document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
let html='';
if(!storageOK)html+='<p class="card">Device saving is unavailable or an old save could not be loaded. Export a backup below to preserve your progress.</p>';
if(tab==='town'){html+=village();html+='<section class="card collect-card"><h2>Welcome to your town</h2><p>Your buildings earn <b>'+income()+' coins per hour</b>. Up to eight hours can accumulate.</p><button id="collect">Collect '+Math.floor(state.bank)+' idle coins</button><p class="muted">Higher training tiers improve XP and town income.</p></section>';
SKILLS.forEach((s,i)=>{const t=state.skills[i].tier;html+='<section id="building-'+i+'" class="card skill-card" style="--skill:'+COLORS[i]+'"><div class="row"><span class="building">'+s.icon+'</span><div style="flex:1"><h3>'+s.building+'</h3><p class="muted">'+s.name+' · '+TIERS[t]+' · '+RATES[t]+' XP per score point</p></div></div>'+(t<5?'<button class="wide" data-upgrade="'+i+'" '+(state.coins<COSTS[t+1]?'disabled':'')+'>Upgrade to '+TIERS[t+1]+' · '+COSTS[t+1].toLocaleString()+' coins</button>':'<span class="pill">Fully upgraded</span>')+'</section>';});
html+='<p class="muted">Training facilities are game upgrades. Continue following your personal activity plan.</p><section class="card tools"><h2>Save backup</h2><p class="muted">Progress stays in this browser on this device. Export before switching devices or clearing browser data.</p><button id="export">Export save</button> <label><input id="import" type="file" accept=".json,application/json" style="max-width:100%;margin-top:14px" aria-label="Import save backup"></label></section>';}
if(tab==='check'){const entry=state.days[day()];if(draft.length!==5)draft=entry?entry.scores.slice():[null,null,null,null,null];
html+='<section class="card"><h2>Daily check-in</h2><p>'+day()+'</p><p class="muted">0 = none · 1 = a little · 2 = some · 3 = most · 4 = nearly · 5 = met your goal. Planned rest counts toward following your plan.</p><p class="muted">'+(entry?'Today is saved. Edits adjust the original reward using today’s locked training rates.':'Each point earns 2 coins plus XP at your current training tier.')+'</p></section>';
SKILLS.forEach((s,i)=>html+='<section class="card skill-card" style="--skill:'+COLORS[i]+'"><h3>'+s.icon+' '+s.name+'</h3><p class="muted">'+s.hint+'</p><div class="scores" role="group" aria-label="'+s.name+' score">'+[0,1,2,3,4,5].map(v=>'<button data-skill="'+i+'" data-score="'+v+'" aria-pressed="'+(draft[i]===v)+'">'+v+'</button>').join('')+'</div></section>');
html+='<button id="submit" class="wide" '+(draft.some(v=>v===null)?'disabled':'')+'>'+(entry?'Update Today':'Save Today')+'</button>';}
if(tab==='skills'){html+='<section class="card"><h2>Your fitness skills</h2><p class="muted">Every check-in grows your skills. Upgrade your training facilities to earn more XP.</p></section>';SKILLS.forEach((s,i)=>{let x=state.skills[i],l=level(x.xp),p=l===99?1:(x.xp-XP[l])/(XP[l+1]-XP[l]);html+='<section class="card skill-card" style="--skill:'+COLORS[i]+'"><div class="row"><h3>'+s.icon+' '+s.name+'</h3><b class="level-badge">Level '+l+'</b></div><progress max="1" value="'+p+'" aria-label="'+s.name+' level progress"></progress><div class="row muted"><span>'+x.xp.toLocaleString()+' XP</span><span>'+(l===99?'Mastered 🏆':(XP[l+1]-x.xp).toLocaleString()+' XP to level '+(l+1))+'</span></div><p class="muted">'+TIERS[x.tier]+' training · '+RATES[x.tier]+' XP per point</p></section>';});}
document.getElementById('view').innerHTML=html;save();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.building!==undefined){const el=document.getElementById('building-'+b.dataset.building);el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'center'});el.classList.add('upgrade-flash');setTimeout(()=>el.classList.remove('upgrade-flash'),1200);}
if(b.dataset.tab){tab=b.dataset.tab;draft=[];render();}
if(b.dataset.score!==undefined){draft[Number(b.dataset.skill)]=Number(b.dataset.score);render();}
if(b.id==='collect'){accrue();let n=Math.floor(state.bank);state.bank-=n;state.coins+=n;render();if(n>0)reward('+'+n+' coins');notify('Collected '+n+' coins.');}
if(b.dataset.upgrade!==undefined){accrue();let s=state.skills[Number(b.dataset.upgrade)],cost=COSTS[s.tier+1];if(s.tier<5&&state.coins>=cost){state.coins-=cost;s.tier++;render();reward('Training upgraded!');notify('Training upgraded! Future check-ins earn more XP.');}}
if(b.id==='submit'){if(draft.length!==5||draft.some(v=>!Number.isInteger(v)||v<0||v>5))return;
let old=state.days[day()],rates=old?old.rates:state.skills.map(s=>RATES[s.tier]),previous=old?old.scores:[0,0,0,0,0],delta=draft.reduce((n,v,i)=>n+2*(v-previous[i]),0);
if(state.coins+delta<0){notify('You have already spent these coins. Collect more coins before lowering today’s total.');return;}
let levels=state.skills.map(s=>level(s.xp));state.coins+=delta;state.skills.forEach((s,i)=>s.xp+=rates[i]*(draft[i]-previous[i]));state.days[day()]={scores:draft.slice(),rates};render();let gained=state.skills.filter((s,i)=>level(s.xp)>levels[i]).length;let earned=draft.reduce((n,v,i)=>n+rates[i]*(v-previous[i]),0);if(earned>0)reward('+'+earned+' XP');if(gained)document.querySelectorAll('.skill-card').forEach(el=>el.classList.add('celebrate'));notify('Check-in saved.'+(gained?' Level up in '+gained+' skill'+(gained>1?'s!':'!'):''));}
if(b.id==='export'){accrue();save();const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='fitville-save-'+day()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
});
document.addEventListener('change',async e=>{if(e.target.id!=='import'||!e.target.files[0])return;try{let s=JSON.parse(await e.target.files[0].text());if(!Number.isFinite(s.coins)||s.coins<0||!Array.isArray(s.skills)||s.skills.length!==5||!s.skills.every(x=>Number.isFinite(x.xp)&&x.xp>=0&&Number.isInteger(x.tier)&&x.tier>=0&&x.tier<6)||!s.days||typeof s.days!=='object'||!Number.isFinite(s.bank)||s.bank<0||!Number.isFinite(s.last))throw Error();
for(const v of Object.values(s.days)){if(!Array.isArray(v.scores)||v.scores.length!==5||!v.scores.every(n=>Number.isInteger(n)&&n>=0&&n<=5)||!Array.isArray(v.rates)||v.rates.length!==5||!v.rates.every(n=>RATES.includes(n)))throw Error();}
if(!confirm('Replace progress on this device with this backup?'))return;state=s;draft=[];render();notify('Backup restored.');}catch(err){notify('This file is not a valid Fitville save.');}});
render();setInterval(()=>{if(tab==='town'&&document.visibilityState==='visible')render();},60000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){draft=[];render();}});window.addEventListener('pagehide',()=>{accrue();save();});
</script></body></html>
