<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183f35"><title>Fitville LifeRPG</title>
<link rel="preload" as="image" href="assets/fitville-crossroads-mobile.jpg">
<link rel="stylesheet" href="css/fitville.css?v=20261007-5"></head><body>
<header><div><div class="muted">YOUR EVERYDAY ADVENTURE</div><h1>Fitville LifeRPG</h1><p class="muted">Small habits. A growing town.</p><div class="stats"><button id="wallet" type="button" aria-label="Town gold"></button><span id="total"></span></div></div></header>
<div id="dev-tools" hidden style="position:fixed;z-index:9998;top:12px;right:12px;max-width:360px;width:calc(100% - 24px);background:#fff1f1;border:3px solid #d94a4a;border-radius:18px;padding:14px;box-shadow:0 10px 30px #0003;max-height:85vh;overflow:auto">
<div class="row"><b>🛠 TEST MODE</b><button id="dev-toggle" aria-label="Close test tools">−</button></div>
<div id="dev-body"><p class="muted"><b>Safe test session.</b> Your normal save was backed up when Developer Mode opened.</p><h3>Preview Town Level</h3><div class="choices"><button data-dev-town="1">1</button><button data-dev-town="5">5</button><button data-dev-town="10">10</button><button data-dev-town="15">15</button><button data-dev-town="20">20</button><button data-dev-town="26">26</button></div><h3>Preview Skill Levels</h3><label for="dev-skill">Skill</label><select id="dev-skill"><option value="4">🏋️ Strength</option><option value="3">🚶 Cardio</option><option value="2">🧘 Stretching</option><option value="1">🥗 Healthy Eating</option><option value="0">🌙 Sleep</option><option value="all">All five skills</option></select><label for="dev-level">Level</label><input id="dev-level" type="number" min="1" max="99" value="1" inputmode="numeric"><button class="wide" id="dev-set-level">Set Skill Level</button><div class="choices"><button data-dev-level="1">1</button><button data-dev-level="7">7</button><button data-dev-level="14">14</button><button data-dev-level="50">50</button><button data-dev-level="98">98</button><button data-dev-level="99">99</button></div><button class="wide" id="dev-coins">Add 10,000 <span class="gold-coin" aria-label="gold coin"></span></button><button class="wide" id="dev-restore">Restore Original Save</button><button class="wide" id="dev-exit">Exit Developer Mode</button></div></div>
<button id="dev-open" hidden style="position:fixed;z-index:9997;top:12px;right:12px;background:#d94a4a;color:white;border-radius:999px;padding:10px 14px;font-weight:900">🛠 TEST MODE</button>
<dialog id="check-dialog" aria-labelledby="check-heading"><div id="check-content"></div></dialog><main id="view"></main><dialog id="level-dialog" aria-labelledby="level-heading"><div id="fireworks" aria-hidden="true"></div><div id="level-content"></div><button id="level-next" class="wide">Continue adventure</button></dialog><div id="notice" role="status"></div>
<nav aria-label="Main navigation"><button data-tab="town"><span aria-hidden="true">⌂</span>Town</button><button data-tab="check"><span aria-hidden="true">✓</span>Check-In</button><button data-tab="quests"><span aria-hidden="true">📜</span>Quests</button><button data-tab="skills"><span aria-hidden="true">✦</span>Skills</button><button data-tab="character"><span aria-hidden="true">☺</span>Character</button><button data-tab="settings"><span aria-hidden="true">⚙</span>Settings</button></nav>
<script src="js/fitville.js?v=20261007-1"></script></body></html>
