<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087bd9"><title>Fitness Level Up</title>
<link rel="stylesheet" href="css/fitville.css?v=20261007-header-row"></head><body>
<header><div><div class="muted">YOUR EVERYDAY ADVENTURE</div><h1>Fitness Level Up</h1><p class="muted">Track habits. Build your fitness skills.</p><div class="stats"><span id="overall-level"></span><span id="total"></span></div></div></header>
<div id="dev-tools" hidden>
<div class="row"><b>🛠 TEST MODE</b><button id="dev-toggle" aria-label="Close test tools">−</button></div>
<div id="dev-body"><p class="muted"><b>Safe test session.</b> Your normal save was backed up when Developer Mode opened.</p><h3>Preview Skill Levels</h3><label for="dev-skill">Skill</label><select id="dev-skill"><option value="4">🏋️ Strength</option><option value="3">🚶 Cardio</option><option value="2">🧘 Stretching</option><option value="1">🥗 Healthy Eating</option><option value="0">🌙 Sleep</option><option value="all">All five skills</option></select><label for="dev-level">Level</label><input id="dev-level" type="number" min="1" max="99" value="1" inputmode="numeric"><button class="wide" id="dev-set-level">Set Skill Level</button><div class="choices"><button data-dev-level="1">1</button><button data-dev-level="7">7</button><button data-dev-level="14">14</button><button data-dev-level="50">50</button><button data-dev-level="98">98</button><button data-dev-level="99">99</button></div><button class="wide" id="dev-restore">Restore Original Save</button><button class="wide" id="dev-exit">Exit Developer Mode</button></div></div>
<button id="dev-open" hidden>🛠 TEST MODE</button>
<dialog id="check-dialog" aria-labelledby="check-heading"><div id="check-content"></div></dialog><main id="view"></main><dialog id="level-dialog" aria-labelledby="level-heading"><div id="fireworks" aria-hidden="true"></div><div id="level-content"></div><button id="level-next" class="wide">Continue</button></dialog><div id="notice" role="status"></div>
<nav aria-label="Main navigation"><button data-tab="settings"><span aria-hidden="true">⚙</span>Settings</button></nav>
<script src="js/fitville.js?v=20261007-reset"></script></body></html>
