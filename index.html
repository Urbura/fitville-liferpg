<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183f35"><title>Fitville LifeRPG</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5ed;color:#203c33;font:16px system-ui,sans-serif}header{background:#183f35;color:white;padding:24px 20px}header>div,main{max-width:720px;margin:auto}h1{margin:0;font-size:30px}p{line-height:1.5}.muted{color:#597067;font-size:14px}header .muted{color:#bdd5c8}main{padding:18px 16px 100px}button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:#28684f;color:white;cursor:pointer;min-height:44px}button:disabled{opacity:.5;cursor:default}.card{background:white;border:1px solid #d9e3d5;border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 4px 16px #203c3307}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}h2{font-size:21px;margin:0 0 12px}h3{margin:0;font-size:18px}.scores{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:16px}.scores button{padding:10px 0;background:#edf1e8;color:#203c33}.scores button[aria-pressed=true]{background:#28684f;color:white;outline:2px solid #d5a850}progress{width:100%;height:14px;accent-color:#d5a850;margin:12px 0 4px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d9e3d5;display:flex;justify-content:center;padding:10px 8px calc(10px + env(safe-area-inset-bottom));gap:10px}nav button{background:#edf1e8;color:#203c33}nav button[aria-selected=true]{background:#183f35;color:white}#notice{position:fixed;top:14px;left:16px;right:16px;max-width:680px;margin:auto;background:#183f35;color:white;padding:16px;border-radius:14px;z-index:3}#notice:empty{display:none}.wide{width:100%}.stats{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}.stats span{background:#ffffff15;padding:8px 12px;border-radius:10px}.building{font-size:36px}.pill{font-size:12px;background:#edf1e8;padding:5px 9px;border-radius:20px}.tools{margin-top:24px}a{color:#28684f}

body{background:radial-gradient(ellipse at top,#e4efe3,transparent 70%),#faf7ee}header{background:linear-gradient(130deg,#173f36,#326b53);border-radius:0 0 32px 32px;padding-top:30px;box-shadow:0 10px 30px #183f3515}h1{font-size:34px;letter-spacing:-1.2px}header p{margin:8px 0}main{max-width:720px}.card{background:#fffdf8;border-color:#e7e7d8;box-shadow:0 5px 0 #e7e7d866,0 10px 26px #203c3308}button{transition:transform .15s,background .2s;box-shadow:0 3px 0 #183f3520}button:active{transform:translateY(2px)}button:focus-visible{outline:3px solid #bf871d;outline-offset:4px}.skill-card{border-left:5px solid var(--skill)}.skill-card h3{color:var(--skill)}.skill-card .scores button[aria-pressed=true]{background:var(--skill);outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--skill) 20%,transparent)}.skill-card progress{accent-color:var(--skill)}.level-badge{background:var(--skill);color:#fff;border-radius:13px;padding:9px 12px;white-space:nowrap;font-size:14px}.building{background:#f0f3e9;border-radius:17px;width:64px;height:64px;display:grid;place-items:center;flex-shrink:0}.pill{background:#e7f1e0;color:#355c36}.town-map{position:relative;overflow:hidden;border-radius:24px;background:#acd193;margin-bottom:18px;border:5px solid #fffdf8;box-shadow:0 8px 25px #203c3310;aspect-ratio:1.1}.town-map>svg{width:100%;height:100%;position:absolute;inset:0}.map-building{position:absolute;width:30%;padding:0;background:transparent;color:#203c33;box-shadow:none;min-height:0;filter:drop-shadow(0 4px 2px #36563725)}.map-building svg{display:block;width:100%;height:auto}.map-building .map-label{display:inline-block;background:#fffdf5ef;border:1px solid #e3dec5;border-radius:9px;padding:4px 6px;font-size:clamp(10px,2.6vw,13px);font-weight:650;box-shadow:0 3px 0 #7d9a6720}.map-building:hover{transform:translateY(-3px)}.map-building:nth-of-type(1){left:9%;top:5%}.map-building:nth-of-type(2){right:9%;top:5%}.map-building:nth-of-type(3){left:2%;top:44%}.map-building:nth-of-type(4){right:2%;top:44%}.map-building:nth-of-type(5){left:35%;top:65%}.town-heading{margin:5px 4px 14px}.town-heading p{margin:0}.collect-card{background:linear-gradient(120deg,#fffae7,#fffdf8)}#collect{background:#b77b20;color:white;font-weight:650;width:100%}nav{background:#fffdf5f5;backdrop-filter:blur(12px);gap:6px}nav button{flex:1;max-width:170px;background:transparent;box-shadow:none;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:3px}nav button span{font-size:21px}nav button[aria-selected=true]{background:#e4eee1;color:#183f35}#notice{box-shadow:0 8px 30px #203c3325;border:1px solid #eac67a;animation:toast .25s ease-out}.reward{position:fixed;z-index:5;left:50%;top:40%;pointer-events:none;color:#865411;font-size:28px;font-weight:800;text-shadow:0 2px #fff;background:#fff5d7;border-radius:20px;padding:15px 22px;animation:reward 1.8s ease-out forwards}.celebrate{animation:glow 1s ease-out}.upgrade-flash{animation:glow 1s ease-out}.map-caption{text-align:center;font-size:12px;color:#4b6555;margin:-6px 0 20px}@keyframes reward{0%{opacity:0;transform:translate(-50%,20px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90px)}}@keyframes toast{from{transform:translateY(-15px);opacity:0}to{transform:translateY(0);opacity:1}}@keyframes glow{0%,100%{box-shadow:0 5px 0 #e7e7d866}45%{box-shadow:0 0 25px 8px #e4be5b80}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.reward{opacity:1}}


body{background:linear-gradient(150deg,#edf0ff,#fff4ed 60%,#eef8ee)}header{background:linear-gradient(125deg,#252d59,#586498);border-bottom:3px solid #ddc69a}h1,h2,h3{letter-spacing:.2px}h1{font-size:32px}.card{border:1px solid #dedbed;background:#fffdfc;box-shadow:0 5px 0 #dedbed88,0 12px 25px #252d5908}button{background:#536396}nav button[aria-selected=true]{background:#e8e9f8;color:#35436d}.character-card{background:linear-gradient(120deg,#eaeaff,#fff2df);display:flex;align-items:center;gap:18px;border:2px solid #e1c596}.portrait{width:110px;flex-shrink:0}.portrait svg{width:100%;display:block}.character-card h2{margin-bottom:5px}.creator{text-align:center}.creator .portrait{width:170px;margin:0 auto 15px}.creator input{font:inherit;border:1px solid #c9cbe0;border-radius:12px;padding:14px;width:100%;background:#fff;min-height:48px;margin:8px 0 18px}.choices{display:flex;gap:10px;justify-content:center;margin:10px 0 20px;flex-wrap:wrap}.choices button{background:#e9eaf5;color:#303c66}.choices button[aria-pressed=true]{background:#536396;color:white;outline:3px solid #e1c596}.creator label,.creator legend{font-weight:650}.creator fieldset{border:0;padding:0;margin:12px 0}.restart{background:#eee6ed;color:#684655;margin-top:15px}.character-meta{font-size:13px;color:#606787}.anime-tag{display:inline-block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#656284;margin-bottom:7px}@media(max-width:360px){.portrait{width:85px}.character-card{gap:10px}}
nav[hidden]{display:none}body{background:linear-gradient(145deg,#d8f3ff,#eefbff)}header{background:linear-gradient(125deg,#0875dd,#28b7ff);border-bottom-color:#8bd9ff}button{background:#087cd9}.card{border-color:#b9e4ff;box-shadow:0 5px 0 #c9eaff80,0 12px 25px #0777cd10}nav button[aria-selected=true]{background:#d0efff;color:#0066b0}.town-map{background:#68dd38}.character-card{background:linear-gradient(120deg,#d2efff,#f0fbff);border-color:#80cfff}.choices button[aria-pressed=true]{background:#087cd9}.map-label b{display:block;color:#076abd;font-size:11px}.building-level{background:#d6f0ff;color:#0062aa;border-radius:9px;padding:5px 8px;font-size:12px;white-space:nowrap}.saved-score{background:#e0f4ff;color:#086bad;padding:10px;border-radius:12px;font-weight:650}.check-save{width:100%;margin-top:12px}dialog{border:2px solid #efc96a;border-radius:26px;background:linear-gradient(145deg,#e2f5ff,#fffdf4);color:#203c55;max-width:390px;width:calc(100% - 32px);padding:30px 22px;text-align:center;overflow:hidden;box-shadow:0 20px 80px #15326555}dialog::backdrop{background:#102345b3;backdrop-filter:blur(5px)}#level-content,#level-next{position:relative;z-index:1}#level-content h2{font-size:40px;color:#087cd9;margin:12px 0}.level-emblem{font-size:65px;margin:15px}.skill-crown{width:110px;display:block;margin:12px auto}.title-label{font-weight:650;color:var(--skill);margin:8px 0}.crown-unlock{background:#fff5d6;border:1px solid #efce77;border-radius:15px;text-align:center;padding:10px;margin-top:12px}#fireworks{position:absolute;inset:0;pointer-events:none}.spark{position:absolute;width:5px;height:5px;border-radius:50%;animation:burst 1.4s ease-out both;box-shadow:0 0 5px currentColor}@keyframes burst{0%{opacity:0;transform:translate(0,0) scale(0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}@media(prefers-reduced-motion:reduce){.spark{display:none}}.back-button{background:#d4edff;color:#075fa5;margin-bottom:18px;box-shadow:none}.building-detail{text-align:center}.detail-house{width:220px;max-width:80%;margin:15px auto}.detail-house svg{width:100%;display:block}.detail-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.detail-stats>div{background:#edf6ff;border-radius:16px;padding:16px 8px}.detail-stats b{display:block;font-size:28px;color:#087cd9}.detail-stats span{font-size:12px;color:#4d6478}.upgrade-preview{background:#f3f8ff;border:1px solid #c9e5ff;border-radius:18px;padding:20px;margin:18px 0}.visit-check{background:#e0efff;color:#075fa5}</style></head><body>
<header><div><div class="muted">YOUR EVERYDAY ADVENTURE</div><h1>Fitville LifeRPG</h1><p class="muted">Small habits. A growing town.</p><div class="stats"><span id="wallet"></span><span id="total"></span></div></div></header>
<main id="view"></main><dialog id="level-dialog" aria-labelledby="level-heading"><div id="fireworks" aria-hidden="true"></div><div id="level-content"></div><button id="level-next" class="wide">Continue adventure</button></dialog><div id="notice" role="status"></div>
<nav aria-label="Main navigation"><button data-tab="town"><span aria-hidden="true">⌂</span>Town</button><button data-tab="check"><span aria-hidden="true">✓</span>Check-In</button><button data-tab="skills"><span aria-hidden="true">✦</span>Skills</button></nav>
<script>
const SKILLS=[
{name:'Sleep',building:'Rest Lodge',icon:'🌙',hint:'Your proposed 5/5 target: 7½–8½ hours of sleep.'},
{name:'Healthy Eating',building:'Fresh Market',icon:'🥗',hint:'Rate how well you followed your personal eating goals.'},
{name:'Stretching',building:'Wellness Studio',icon:'🧘',hint:'Rate completion of your planned mobility routine.'},
{name:'Cardio',building:'Walking Trail',icon:'🚶',hint:'Rate completion of your movement or cardio goal.'},
{name:'Strength',building:'Training Gym',icon:'🏋️',hint:'Rate following your workout plan; planned recovery counts.'}
];
const TIERS=['Starter','Basic','Improved','Advanced','Elite','Master'];
const RATES=[1,5,20,80,250,600], COSTS=[0,15,500,2000,8000,25000];
const KEY='fitville-v1', CAP=8*60*60*1000;
const XP=[0,0];let points=0;for(let l=1;l<99;l++){points+=Math.floor(l+300*Math.pow(2,l/7));XP[l+1]=Math.ceil(Math.floor(points/4)/100);}
function level(x){let l=1;while(l<99&&x>=XP[l+1])l++;return l;}
function fresh(){return{coins:0,skills:SKILLS.map(()=>({xp:0,tier:0})),days:{},last:Date.now(),bank:0};}
let state=fresh(),storageOK=true;
try{let raw=localStorage.getItem(KEY);if(raw){let s=JSON.parse(raw);if(!s||!Number.isFinite(s.coins)||s.coins<0||!Array.isArray(s.skills)||s.skills.length!==5||!s.skills.every(x=>Number.isFinite(x.xp)&&x.xp>=0&&Number.isInteger(x.tier)&&x.tier>=0&&x.tier<6)||!s.days||!Number.isFinite(s.last)||!Number.isFinite(s.bank))throw Error('Invalid save');state=s;}}catch(e){storageOK=false;}
let tab='town',draft=[],timer,selectedBuilding=0;
function day(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function income(){return 2+state.skills.reduce((n,s)=>n+s.tier*2,0);}
function accrue(){const now=Date.now();state.bank=Math.min(income()*8,state.bank+Math.min(CAP,Math.max(0,now-state.last))/3600000*income());state.last=now;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;notify('Saving is unavailable. Keep this page open or export a backup.');}}
function notify(t){document.getElementById('notice').textContent=t;clearTimeout(timer);timer=setTimeout(()=>document.getElementById('notice').textContent='',5000);}

const COLORS=['#7962a6','#4f7836','#267b7d','#ad5b28','#3b6daa'];
function house(i,t){
const c=COLORS[i], roofs=['#8871b4','#6e954d','#479a98','#d48550','#588ac2'];
return '<svg viewBox="0 0 140 110" aria-hidden="true"><ellipse cx="70" cy="98" rx="50" ry="9" fill="#628957" opacity=".25"/>'+
(t>1?'<rect x="14" y="55" width="25" height="38" rx="3" fill="#f1dfbc"/><path d="M10 55L26 40L42 55Z" fill="'+roofs[i]+'"/>':'')+
'<rect x="35" y="48" width="70" height="47" rx="4" fill="#fff0cf"/><path d="M25 50L70 19L115 50Z" fill="'+roofs[i]+'"/><path d="M25 50L70 19L115 50" fill="none" stroke="'+c+'" stroke-width="5" stroke-linejoin="round"/><rect x="61" y="66" width="19" height="29" rx="5" fill="#866947"/><rect x="43" y="60" width="12" height="15" rx="3" fill="#9fc6cb"/><rect x="86" y="60" width="12" height="15" rx="3" fill="#9fc6cb"/>'+
(t>0?'<rect x="92" y="20" width="9" height="22" rx="2" fill="#c79976"/>':'')+
(t>2?'<path d="M37 78H103V87H37Z" fill="'+roofs[i]+'"/><rect x="108" y="58" width="10" height="36" fill="#dcc79e"/>':'')+
(t>3?'<path d="M113 19V60" stroke="#795d42" stroke-width="3"/><path d="M114 20H135L124 28L135 35H114Z" fill="#e7bb53"/>':'')+
(t>4?'<path d="M59 16L63 7L70 13L77 7L81 16Z" fill="#ecc75a" stroke="#ad8026" stroke-width="2"/>':'')+
'<text x="70" y="52" text-anchor="middle" font-size="20">'+SKILLS[i].icon+'</text></svg>';
}
function village(){return '<div class="row town-heading"><div><h2>Your little Fitville</h2><p class="muted">Grow a town, one good day at a time.</p></div><span class="pill">5 neighbourhoods</span></div><div class="town-map" aria-label="Fitville village"><svg viewBox="0 0 600 550" preserveAspectRatio="none" aria-hidden="true"><rect width="600" height="550" fill="#6edf3e"/><path d="M0 270Q180 220 300 285T600 245M300 0V550" stroke="#e9dbb7" stroke-width="38" fill="none"/><path d="M300 150L125 155M300 150L475 155M300 370L115 370M300 370L485 370" stroke="#e9dbb7" stroke-width="24"/><ellipse cx="300" cy="280" rx="53" ry="42" fill="#ded8b8"/><ellipse cx="300" cy="274" rx="36" ry="26" fill="#79b7c0"/><ellipse cx="300" cy="270" rx="22" ry="13" fill="#a3d3d6"/><path d="M300 246V269" stroke="#f3f9e8" stroke-width="6" stroke-linecap="round"/>'+
[[30,40],[550,25],[45,195],[565,183],[25,490],[545,490],[200,460],[425,445]].map(([x,y])=>'<g transform="translate('+x+' '+y+')"><rect x="13" y="24" width="8" height="22" rx="3" fill="#93754c"/><circle cx="17" cy="14" r="23" fill="#26a73a"/><circle cx="10" cy="9" r="14" fill="#4fc749"/></g>').join('')+
'<g fill="#f9efc8"><circle cx="205" cy="220" r="4"/><circle cx="405" cy="208" r="4"/><circle cx="155" cy="470" r="4"/></g></svg>'+SKILLS.map((s,i)=>'<button class="map-building" data-building="'+i+'" aria-label="View '+s.building+' upgrades">'+house(i,state.skills[i].tier)+'<span class="map-label">'+s.building+'<b>Level '+(state.skills[i].tier+1)+'</b></span></button>').join('')+'</div><p class="map-caption">Tap a building to open its training shop</p>';}
function reward(text){let el=document.createElement('div');el.className='reward';el.textContent=text;document.body.append(el);setTimeout(()=>el.remove(),1900);}


let appearance={hair:0,outfit:0,skin:0};
const HAIR=['#34314e','#9a613f','#e1bb66'], OUTFIT=['#687dc5','#638f76','#bc778d'], SKIN=['#f8d8bc','#c99571','#82533f'];
function avatar(a){const hair=HAIR[a.hair]||HAIR[0],outfit=OUTFIT[a.outfit]||OUTFIT[0],skin=SKIN[a.skin]||SKIN[0];return '<svg viewBox="0 0 180 210" role="img" aria-label="Your anime-inspired adventurer"><circle cx="90" cy="95" r="79" fill="#fff7e8"/><path d="M38 205Q35 147 90 144Q145 147 142 205" fill="'+outfit+'" stroke="#343650" stroke-width="3"/><path d="M73 143L90 169L107 143" fill="#fff3db" stroke="#343650" stroke-width="2"/><path d="M79 125V148Q90 162 101 148V125" fill="'+skin+'" stroke="#343650" stroke-width="2"/><path d="M39 87Q31 20 90 21Q151 20 141 104L129 129H50Z" fill="'+hair+'" stroke="#343650" stroke-width="3"/><ellipse cx="45" cy="93" rx="9" ry="13" fill="'+skin+'"/><ellipse cx="135" cy="93" rx="9" ry="13" fill="'+skin+'"/><path d="M47 64Q90 33 133 64V101Q128 139 90 144Q52 138 47 101Z" fill="'+skin+'" stroke="#343650" stroke-width="2"/><path d="M40 83L44 48Q90 3 137 49L142 87L115 57L97 79L94 48L72 74L65 53Z" fill="'+hair+'" stroke="#343650" stroke-width="2"/><path d="M57 90Q67 81 78 89M102 89Q113 81 124 90" stroke="#343650" fill="none" stroke-width="3"/><ellipse cx="69" cy="100" rx="8" ry="12" fill="white"/><ellipse cx="112" cy="100" rx="8" ry="12" fill="white"/><ellipse cx="70" cy="102" rx="5" ry="9" fill="#667daf"/><ellipse cx="111" cy="102" rx="5" ry="9" fill="#667daf"/><circle cx="72" cy="98" r="2.5" fill="white"/><circle cx="113" cy="98" r="2.5" fill="white"/><path d="M83 122Q90 128 98 121" fill="none" stroke="#9c6259" stroke-width="2.5" stroke-linecap="round"/><path d="M53 113H66M116 113H129" stroke="#d38387" stroke-width="3" opacity=".6"/><path d="M51 179H73M107 179H129" stroke="#fff2da" stroke-width="4"/><circle cx="90" cy="180" r="7" fill="#e8c66f" stroke="#343650" stroke-width="2"/></svg>';}
function safeText(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function creator(){return '<section class="card creator"><span class="anime-tag">A new adventure begins</span><h2>Create your adventurer</h2><div class="portrait">'+avatar(appearance)+'</div><label for="character-name">Character name</label><input id="character-name" maxlength="24" placeholder="Your adventurer’s name" autocomplete="off"><fieldset><legend>Hair</legend><div class="choices">'+['Midnight','Chestnut','Golden'].map((n,i)=>'<button data-look="hair" data-value="'+i+'" aria-pressed="'+(appearance.hair===i)+'">'+n+'</button>').join('')+'</div></fieldset><fieldset><legend>Outfit</legend><div class="choices">'+['Sky','Forest','Rose'].map((n,i)=>'<button data-look="outfit" data-value="'+i+'" aria-pressed="'+(appearance.outfit===i)+'">'+n+'</button>').join('')+'</div></fieldset><fieldset><legend>Skin tone</legend><div class="choices">'+['Light','Medium','Deep'].map((n,i)=>'<button data-look="skin" data-value="'+i+'" aria-pressed="'+(appearance.skin===i)+'">'+n+'</button>').join('')+'</div></fieldset><p class="muted">All five skills begin at level 1 with 0 XP.</p><button id="begin" class="wide">Begin your adventure</button>'+(state.skills.some(s=>s.xp>0)||state.coins>0?'<p class="muted">You already have saved progress. Creating this character keeps it. Use “Start a new adventure” in Town to reset to 0 XP.</p>':'')+'</section>';}
function characterCard(){const c=state.character;return '<section class="card character-card"><div class="portrait">'+avatar(c)+'</div><div><span class="anime-tag">Fitville adventurer</span><h2>'+safeText(c.name)+'</h2><p class="character-meta">Five skills. One adventure.</p><b>'+state.skills.reduce((n,s)=>n+s.xp,0).toLocaleString()+' total XP</b></div></section>';}


const TITLES=[
['Dreamer','Rest Seeker','Moon Walker','Night Guardian','Dream Weaver','Rest Keeper','Moonlight Adept','Dream Sage','Twilight Warden','Rest Champion','Dream Knight','Moonlight Master','Celestial Sleeper','Dream Sovereign','Dream Ascendant'],
['Fresh Starter','Balanced Bite','Nourished Explorer','Garden Guardian','Balanced Builder','Nourishment Keeper','Harvest Adept','Harvest Sage','Garden Warden','Nourishment Champion','Harvest Knight','Balance Master','Nourishment Legend','Harvest Sovereign','Nourishment Ascendant'],
['First Stretch','Limber Learner','Flow Seeker','Flexible Explorer','Flow Adept','Mobility Keeper','Balance Adept','Flow Sage','Mobility Warden','Flexibility Champion','Flow Knight','Mobility Master','Flow Legend','Flow Sovereign','Flow Ascendant'],
['Trail Starter','Steady Strider','Distance Seeker','Swift Runner','Endurance Adept','Trail Keeper','Fleetfoot','Endurance Sage','Trail Warden','Cardio Champion','Wind Knight','Endurance Master','Trail Legend','Wind Sovereign','Wind Ascendant'],
['First Lift','Iron Learner','Power Builder','Iron Guardian','Strength Adept','Power Keeper','Ironheart','Strength Sage','Iron Warden','Strength Champion','Iron Knight','Power Master','Iron Legend','Iron Sovereign','Iron Ascendant']
];
const CROWNS=['Moonlight Crown','Harvest Crown','Harmony Crown','Wind Crown','Iron Crown'];
const SYMBOLS=['☾','✿','◇','ϟ','◆'];
function titleFor(i,l){return l===99?TITLES[i][14]:l<7?'Novice':TITLES[i][Math.floor(l/7)-1];}
function crown(i){return '<svg class="skill-crown" viewBox="0 0 120 85" role="img" aria-label="'+CROWNS[i]+'"><path d="M15 62L7 22L34 39L60 7L86 39L113 22L105 62Z" fill="'+COLORS[i]+'" stroke="#d6a642" stroke-width="5" stroke-linejoin="round"/><rect x="15" y="62" width="90" height="14" rx="4" fill="#f0c965" stroke="#b6892e" stroke-width="3"/><circle cx="60" cy="43" r="15" fill="#fff2bd"/><text x="60" y="49" text-anchor="middle" fill="'+COLORS[i]+'" font-size="21">'+SYMBOLS[i]+'</text></svg>';}
let celebrations=[],celebrationFocus;
function queueLevels(i,before,after){for(let l=before+1;l<=after;l++)celebrations.push({i,l});if(celebrations.length&&!document.getElementById('level-dialog').open){celebrationFocus=document.activeElement;showLevel();}}
function showLevel(){const item=celebrations[0];if(!item)return;const {i,l}=item,unlock=l===99?'Mastery title: '+titleFor(i,l)+' · '+CROWNS[i]:l%7===0?'New title: '+titleFor(i,l):'No new item at this level. Next title at level '+(Math.ceil(l/7)*7)+'.';
document.getElementById('level-content').innerHTML='<span class="anime-tag">'+SKILLS[i].name+' level up</span><h2 id="level-heading">Level '+l+'!</h2>'+(l===99?crown(i):'<div class="level-emblem">'+SKILLS[i].icon+'</div>')+'<p><b>'+safeText(unlock)+'</b></p><p class="muted">'+(l===99?'Your skill crown is permanently displayed on your Skills page.':'Current title: '+titleFor(i,l))+'</p>';
document.getElementById('level-next').textContent=celebrations.length>1?'Next level celebration ('+(celebrations.length-1)+' remaining)':'Continue adventure';
const dialog=document.getElementById('level-dialog');if(!dialog.open)dialog.showModal();document.getElementById('level-next').focus();fireworks();}
function fireworks(){const field=document.getElementById('fireworks');field.innerHTML='';if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let burst=0;burst<4;burst++){const x=15+Math.random()*70,y=15+Math.random()*40;for(let j=0;j<16;j++){const p=document.createElement('span'),angle=j*Math.PI/8;p.className='spark';p.style.cssText='left:'+x+'%;top:'+y+'%;background:'+['#ffd35d','#69d9ff','#ff8aca','#96f06c'][burst]+';--dx:'+Math.cos(angle)*110+'px;--dy:'+Math.sin(angle)*110+'px;animation-delay:'+burst*.2+'s';field.append(p);}}}
function nextCelebration(){celebrations.shift();if(celebrations.length)showLevel();else{document.getElementById('level-dialog').close();document.getElementById('fireworks').innerHTML='';if(celebrationFocus&&celebrationFocus.isConnected)celebrationFocus.focus();}}

function render(){accrue();document.getElementById('wallet').textContent='🪙 '+Math.floor(state.coins).toLocaleString()+' coins';document.getElementById('total').textContent='Total level '+state.skills.reduce((n,s)=>n+level(s.xp),0)+' / 495';
document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===(tab==='building'?'town':tab)));
let html='';
if(!state.character){document.getElementById('view').innerHTML=creator();document.querySelector('nav').hidden=true;return;}document.querySelector('nav').hidden=false;
if(!storageOK)html+='<p class="card">Device saving is unavailable or an old save could not be loaded. Export a backup below to preserve your progress.</p>';
if(tab==='town'){html+=characterCard();html+=village();html+='<section class="card collect-card"><h2>Welcome to your town</h2><p>Your buildings earn <b>'+income()+' coins per hour</b>. Up to eight hours can accumulate.</p><button id="collect">Collect '+Math.floor(state.bank)+' idle coins</button><p class="muted">Higher training tiers improve XP and town income.</p></section>';
html+='<p class="muted">Training facilities are game upgrades. Continue following your personal activity plan.</p><section class="card tools"><h2>Your adventure</h2><p class="muted">Progress stays in this browser on this device. Export before switching devices or clearing browser data.</p><button id="export">Export save</button> <label><input id="import" type="file" accept=".json,application/json" style="max-width:100%;margin-top:14px" aria-label="Import save backup"></label><button id="restart" class="restart wide">Start a new adventure · reset progress</button></section>';}
if(tab==='building'){
const i=selectedBuilding,s=SKILLS[i],x=state.skills[i],t=x.tier;
html+='<button id="back-town" class="back-button">← Back to Town</button><section class="card building-detail skill-card" style="--skill:'+COLORS[i]+'"><span class="anime-tag">'+s.name+' training</span><h2>'+s.building+'</h2><div class="detail-house">'+house(i,t)+'</div><span class="building-level">Building level '+(t+1)+'</span><p class="title-label">'+TIERS[t]+' training</p><div class="detail-stats"><div><b>'+RATES[t]+'</b><span>XP per score point</span></div><div><b>'+RATES[t]*5+'</b><span>XP for a 5/5 check-in</span></div></div><p class="muted">Your '+s.name+' skill is level '+level(x.xp)+' · '+titleFor(i,level(x.xp))+'</p>'+(t<5?'<div class="upgrade-preview"><h3>Next: '+TIERS[t+1]+'</h3><p>Building level '+(t+2)+' · '+RATES[t+1]+' XP per point</p><p class="muted">'+(COSTS[t+1]>state.coins?'You need '+Math.ceil(COSTS[t+1]-state.coins).toLocaleString()+' more coins.':'Ready to upgrade!')+'</p><button class="wide" data-upgrade="'+i+'" '+(state.coins<COSTS[t+1]?'disabled':'')+'>Upgrade · '+COSTS[t+1].toLocaleString()+' coins</button></div>':'<div class="upgrade-preview"><h3>Fully upgraded!</h3><p>Your training facility has reached its highest level.</p></div>')+'<button class="wide visit-check" data-tab="check">Open daily check-in</button><p class="muted">Upgrades improve future check-ins and add 2 coins per hour to town income.</p></section>';
}
if(tab==='check'){
const entry=state.days[day()];if(draft.length!==5)draft=[null,null,null,null,null];
html+='<section class="card"><h2>Daily check-in</h2><p>'+day()+'</p><p class="muted">Check in once per skill each day. Saved scores are final until tomorrow.</p><p class="muted">0 = none · 1 = a little · 2 = some · 3 = most · 4 = nearly · 5 = met your goal. Planned rest counts.</p></section>';
SKILLS.forEach((s,i)=>{const done=entry&&Number.isInteger(entry.scores[i]);html+='<section class="card skill-card" style="--skill:'+COLORS[i]+'"><h3>'+s.icon+' '+s.name+'</h3><p class="muted">'+s.hint+'</p>'+(done?'<div class="saved-score">✓ Checked in · '+entry.scores[i]+'/5 · '+(entry.scores[i]*entry.rates[i])+' XP earned</div>':'<div class="scores" role="group" aria-label="'+s.name+' score">'+[0,1,2,3,4,5].map(v=>'<button data-skill="'+i+'" data-score="'+v+'" aria-pressed="'+(draft[i]===v)+'">'+v+'</button>').join('')+'</div><button class="check-save" data-submit="'+i+'" '+(draft[i]===null?'disabled':'')+'>Save '+s.name+' · '+(draft[i]===null?0:draft[i]*RATES[state.skills[i].tier])+' XP</button>')+'</section>';});
}
if(tab==='skills'){html+='<section class="card"><h2>Your fitness skills</h2><p class="muted">Every check-in grows your skills. Upgrade your training facilities to earn more XP.</p></section>';SKILLS.forEach((s,i)=>{let x=state.skills[i],l=level(x.xp),p=l===99?1:(x.xp-XP[l])/(XP[l+1]-XP[l]);html+='<section class="card skill-card" style="--skill:'+COLORS[i]+'"><div class="row"><h3>'+s.icon+' '+s.name+'</h3><b class="level-badge">Level '+l+'</b></div><progress max="1" value="'+p+'" aria-label="'+s.name+' level progress"></progress><div class="row muted"><span>'+x.xp.toLocaleString()+' XP</span><span>'+(l===99?'Mastered 🏆':(XP[l+1]-x.xp).toLocaleString()+' XP to level '+(l+1))+'</span></div><p class="muted">'+TIERS[x.tier]+' training · '+RATES[x.tier]+' XP per point</p><p class="title-label">'+titleFor(i,l)+'</p>'+(l===99?'<div class="crown-unlock">'+crown(i)+'<b>'+CROWNS[i]+'</b><p class="muted">Level 99 mastery reward</p></div>':'<p class="muted">Next title: level '+(Math.min(99,Math.floor(l/7)*7+7))+' · '+titleFor(i,Math.floor(l/7)*7+7)+'</p>')+'</section>';});}
document.getElementById('view').innerHTML=html;save();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.id==='level-next'){nextCelebration();return;}
if(b.dataset.look){const name=document.getElementById('character-name').value;appearance[b.dataset.look]=Number(b.dataset.value);render();document.getElementById('character-name').value=name;}
if(b.id==='begin'){const name=document.getElementById('character-name').value.trim();if(!name){notify('Enter a name for your adventurer.');document.getElementById('character-name').focus();return;}state.character={name:name.slice(0,24),...appearance};save();render();notify('Welcome to Fitville, '+name+'!');}
if(b.id==='restart'){if(!confirm('Start fresh? This removes all XP, coins, upgrades and check-ins on this device. Export a backup first if you want to keep them.'))return;state=fresh();appearance={hair:0,outfit:0,skin:0};draft=[];tab='town';save();render();notify('New adventure ready. Every skill starts at 0 XP.');}
if(b.dataset.building!==undefined){selectedBuilding=Number(b.dataset.building);tab='building';render();window.scrollTo(0,0);}
if(b.id==='back-town'){tab='town';render();window.scrollTo(0,0);}
if(b.dataset.tab){tab=b.dataset.tab;draft=[];render();window.scrollTo(0,0);}
if(b.dataset.score!==undefined){draft[Number(b.dataset.skill)]=Number(b.dataset.score);render();}
if(b.id==='collect'){accrue();let n=Math.floor(state.bank);state.bank-=n;state.coins+=n;render();if(n>0)reward('+'+n+' coins');notify('Collected '+n+' coins.');}
if(b.dataset.upgrade!==undefined){accrue();let s=state.skills[Number(b.dataset.upgrade)],cost=COSTS[s.tier+1];if(s.tier<5&&state.coins>=cost){state.coins-=cost;s.tier++;render();reward('Training upgraded!');notify('Training upgraded! Future check-ins earn more XP.');}}
if(b.dataset.submit!==undefined){
const i=Number(b.dataset.submit),score=draft[i];if(!Number.isInteger(i)||i<0||i>=5||!Number.isInteger(score)||score<0||score>5)return;
const key=day();let entry=state.days[key];if(entry&&Number.isInteger(entry.scores[i])){notify('This skill is already checked in today.');return;}
if(!entry)entry=state.days[key]={scores:[null,null,null,null,null],rates:[null,null,null,null,null]};
const rate=RATES[state.skills[i].tier],before=level(state.skills[i].xp);entry.scores[i]=score;entry.rates[i]=rate;state.skills[i].xp+=score*rate;state.coins+=score*2;draft[i]=null;render();if(score>0)reward('+'+(score*rate)+' XP · +'+(score*2)+' coins');notify(SKILLS[i].name+' saved for today.');queueLevels(i,before,level(state.skills[i].xp));
}
if(b.id==='export'){accrue();save();const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='fitville-save-'+day()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
});
document.addEventListener('change',async e=>{if(e.target.id!=='import'||!e.target.files[0])return;try{let s=JSON.parse(await e.target.files[0].text());if(!Number.isFinite(s.coins)||s.coins<0||!Array.isArray(s.skills)||s.skills.length!==5||!s.skills.every(x=>Number.isFinite(x.xp)&&x.xp>=0&&Number.isInteger(x.tier)&&x.tier>=0&&x.tier<6)||!s.days||typeof s.days!=='object'||!Number.isFinite(s.bank)||s.bank<0||!Number.isFinite(s.last))throw Error();
if(s.character&&(!s.character.name||typeof s.character.name!=='string'||s.character.name.length>24||!['hair','outfit','skin'].every(k=>Number.isInteger(s.character[k])&&s.character[k]>=0&&s.character[k]<3)))throw Error();
for(const v of Object.values(s.days)){if(!Array.isArray(v.scores)||v.scores.length!==5||!v.scores.every(n=>n===null||(Number.isInteger(n)&&n>=0&&n<=5))||!Array.isArray(v.rates)||v.rates.length!==5||!v.rates.every((n,i)=>v.scores[i]===null?n===null:RATES.includes(n)))throw Error();}
if(!confirm('Replace progress on this device with this backup?'))return;state=s;draft=[];render();notify('Backup restored.');}catch(err){notify('This file is not a valid Fitville save.');}});
document.getElementById('level-dialog').addEventListener('cancel',e=>{e.preventDefault();nextCelebration();});
render();setInterval(()=>{if(tab==='town'&&document.visibilityState==='visible')render();},60000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){draft=[];render();}});window.addEventListener('pagehide',()=>{accrue();save();});
</script></body></html>
