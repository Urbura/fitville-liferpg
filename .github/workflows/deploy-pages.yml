name: Deploy Fitville to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Optimize town background for mobile
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert assets/fitville-crossroads.png -resize '960x960>' -strip -interlace Plane -sampling-factor 4:2:0 -quality 76 assets/fitville-crossroads-mobile.jpg
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
